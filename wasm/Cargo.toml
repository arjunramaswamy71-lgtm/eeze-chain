[package]
name = "eeze-wasm"
version = "0.1.0"
edition = "2024"
description = "EEZE Chain running in the browser: several simulated nodes on the real chain code."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
eeze_core = { path = "../core", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

strip = true
