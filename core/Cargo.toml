[package]
name = "eeze_core"
version = "0.1.0"
edition = "2024"

[dependencies]
blake3 = "1.8.7"
ed25519-dalek = { version = "2" }
hex = "0.4.3"
merlin = { version = "3", default-features = false }
rand_core = { version = "0.6", default-features = false }
getrandom = { version = "0.2", optional = true }
schnorrkel = { version = "0.11", default-features = false, features = ["alloc"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
wasmi = "2.0.0"

[dev-dependencies]
criterion = "0.8"
proptest = "1"
wat = "1.262.0"

[features]
default = ["os-rng"]
# Makes brand-new random wallets. Off in the browser build, which brings its own randomness.
os-rng = ["dep:getrandom", "rand_core/getrandom", "ed25519-dalek/rand_core"]

[[bench]]
name = "throughput"
harness = false
